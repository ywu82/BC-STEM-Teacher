<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="audience" content="{{AUDIENCE}}">
  <title>{{TITLE}}</title>
  <style>
    :root { color-scheme: light; --ink:#172033; --muted:#5f6b7a; --line:#d8dee8; --accent:#2457e6; --paper:#fff; --bg:#eef2f7; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); line-height:1.55; }
    .toolbar { position:sticky; top:0; z-index:10; display:flex; justify-content:space-between; align-items:center; gap:12px; padding:12px max(18px,calc((100vw - 960px)/2)); background:#ffffffee; border-bottom:1px solid var(--line); backdrop-filter:blur(8px); }
    button { min-height:44px; padding:9px 14px; border:1px solid var(--accent); border-radius:9px; background:var(--accent); color:white; font:inherit; font-weight:700; cursor:pointer; }
    button:focus-visible, a:focus-visible { outline:3px solid #f59e0b; outline-offset:3px; }
    main { max-width:960px; margin:24px auto; padding:0 18px 48px; }
    header, .page, .slide, .card { background:var(--paper); border:1px solid var(--line); border-radius:16px; padding:clamp(20px,4vw,38px); margin:0 0 18px; box-shadow:0 5px 18px #1018280b; }
    h1 { margin:.15em 0; font-size:clamp(2rem,5vw,3.5rem); line-height:1.08; }
    h2 { margin-top:0; }
    .meta, .muted { color:var(--muted); }
    .objective { display:inline-block; margin:3px; padding:4px 9px; border-radius:999px; background:#e9efff; color:#173ca7; font-size:.85rem; font-weight:700; }
    .question { border-left:4px solid var(--accent); padding:10px 16px; margin:14px 0; background:#f7f9ff; }
    .page-break { break-before:page; }
    svg, img { max-width:100%; height:auto; }
    @media (max-width:600px) { .toolbar { align-items:flex-start; } header,.page,.slide,.card { padding:18px; border-radius:12px; } }
    @media print {
      @page { size:auto; margin:14mm; }
      body { background:white; color:black; }
      .toolbar, .no-print { display:none !important; }
      main { max-width:none; margin:0; padding:0; }
      header, .page, .slide, .card { border:0; box-shadow:none; border-radius:0; padding:0; margin:0 0 10mm; break-inside:avoid; }
      a { color:black; text-decoration:none; }
      .slide { break-after:page; min-height:auto; }
    }
  </style>
</head>
<body>
  <div class="toolbar" role="region" aria-label="Document controls">
    <div><strong>{{COURSE}}</strong><br><span class="muted">{{AUDIENCE}}</span></div>
    <button type="button" onclick="window.print()">Print / Save as PDF</button>
  </div>
  <main>
    <header>
      <p class="meta">{{COURSE}} · {{AUDIENCE}}</p>
      <h1>{{TITLE}}</h1>
      <p>{{PURPOSE}}</p>
    </header>
    {{CONTENT}}
    <footer class="muted">{{FOOTER_NOTE}}</footer>
  </main>
</body>
</html>
